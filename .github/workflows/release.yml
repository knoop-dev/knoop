name: release

on:
  push:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract project version from CMakeLists.txt
        id: version
        run: |
          version=$(grep -oP '(?<=VERSION )\d+\.\d+\.\d+' CMakeLists.txt)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" \
                  -m "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

  create-release:
    runs-on: ubuntu-latest
    needs: create-tag
    if: needs.create-tag.outputs.exists == 'false'
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.create-tag.outputs.version }}

  build:
    needs: [create-tag, create-release]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install hdf5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libopenblas-dev

      - name: Create build directory
        run: |
          cmake -B ${{github.workspace}}/build \
                -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: |
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Package CLI binary
        run: |
          tar -czf knoop-v${{ needs.create-tag.outputs.version }}-${{ matrix.name }}.tar.gz \
              -C ${{github.workspace}}/build knoop

      - name: Upload CLI binary
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.create-tag.outputs.version }}
          files: knoop-v${{ needs.create-tag.outputs.version }}-${{ matrix.name }}.tar.gz
